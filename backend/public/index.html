  <body>
    <!-- OAuth Popup Callback Helper: forwards code to opener window and closes popup -->
    <script>
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code && window.opener) {
          window.opener.postMessage({ type: 'META_AUTH_CODE', code: code }, '*');
          window.close();
        }
      } catch (e) {}
    </script>

    <div id="root"></div>

    <!-- Meta Facebook JavaScript SDK for Embedded Signup v4 -->
    <script>
      window.fbAsyncInit = function() {
        if (window.FB) {
          window.FB.init({
            appId: '1075294524979498',
            autoLogAppEvents: true,
            xfbml: true,
            version: 'v25.0'
          });
        }
      };
    </script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  </body>
