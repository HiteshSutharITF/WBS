# Nginx Configuration for WBS (WhatsApp Business Solution)
# Domain: wbs.itfuturz.in
# Upstream Node.js Backend Port: 2222

upstream wbs_backend {
    server 127.0.0.1:2222;
    keepalive 64;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name wbs.itfuturz.in;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://System.Management.Automation.Internal.Host.InternalHost;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wbs.itfuturz.in;

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/wbs.itfuturz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wbs.itfuturz.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size for WhatsApp media attachments (images, PDFs, videos)
    client_max_body_size 30M;

    # Socket.io WebSocket Support
    location /socket.io/ {
        proxy_pass http://wbs_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade ;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Meta WhatsApp Cloud API Webhook endpoint
    location /webhook {
        proxy_pass http://wbs_backend/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # API endpoints & Uploads
    location /api/ {
        proxy_pass http://wbs_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }

    location /uploads/ {
        proxy_pass http://wbs_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Super Admin Console (/admin and /admin/*)
    location /admin {
        proxy_pass http://wbs_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }

    # Client Portal Root & All Other Routes
    location / {
        proxy_pass http://wbs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }
}
